name: passless

# Backing services only. The API and the Angular dev server run on the host so
# that hot reload and the debugger work; containerising the API is CI's job, not
# a developer's. Adding an `api` service here would make this file a description
# of a workflow nobody actually uses.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-passless}
      POSTGRES_USER: ${POSTGRES_USER:-passless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passless}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-passless} -d ${POSTGRES_DB:-passless}"]
      interval: 5s
      timeout: 3s
      retries: 12

  cache:
    image: redis:7-alpine
    # Persistence off. Redis holds rate-limit counters and other short-lived
    # ceremony state; writing them to disk would create a durable copy of
    # security-relevant material that nothing needs to survive a restart. The
    # tradeoff is that a restart drops in-flight counters -- acceptable, because
    # a lost counter fails safe by making a caller look less throttled for one
    # window, not by admitting a bad credential.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db-data:
